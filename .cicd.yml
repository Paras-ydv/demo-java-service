# .cicd.yml - PipelineHub CI/CD Configuration
name: demo-java-service-pipeline
language: java
environment: development

# Pipeline stages to execute
stages:
  - checkout
  - install
  - build
  - test
  - security_scan
  - package
  - deploy
  - notify

# Environment variables
variables:
  JAVA_VERSION: "17"
  MAVEN_OPTS: "-Xmx2048m"
  SPRING_PROFILES_ACTIVE: prod

# Custom scripts per stage
scripts:
  install:
    - mvn clean install -DskipTests
    - mvn dependency:resolve
  build:
    - mvn compile
    - mvn checkstyle:check
  test:
    - mvn test
    - mvn jacoco:report
    - mvn verify
  security_scan:
    - mvn dependency-check:check
  package:
    - mvn package -DskipTests
    - docker build -t demo-java-service:$COMMIT_HASH .
  deploy:
    - kubectl apply -f k8s/
    - kubectl set image deployment/demo-java-service app=demo-java-service:$COMMIT_HASH
    - kubectl rollout status deployment/demo-java-service --timeout=5m
